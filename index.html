<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palo Alto Firewall Configuration &amp; Management Quiz</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #334155;
    --accent: #f97316;
    --accent-dark: #ea580c;
    --correct: #22c55e;
    --incorrect: #ef4444;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, var(--bg), #1e1b4b);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .container {
    width: 100%;
    max-width: 640px;
  }
  header {
    text-align: center;
    margin-bottom: 24px;
  }
  header h1 {
    font-size: 1.5rem;
    margin: 0 0 6px;
  }
  header p {
    color: var(--text-dim);
    margin: 0;
    font-size: 0.95rem;
  }
  .progress-bar {
    background: var(--card-border);
    border-radius: 999px;
    height: 8px;
    width: 100%;
    margin: 20px 0;
    overflow: hidden;
  }
  .progress-fill {
    background: var(--accent);
    height: 100%;
    border-radius: 999px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  .question-meta {
    display: flex;
    justify-content: space-between;
    color: var(--text-dim);
    font-size: 0.85rem;
    margin-bottom: 12px;
  }
  .prompt {
    font-size: 1.1rem;
    font-weight: 600;
    margin: 0 0 18px;
    line-height: 1.4;
  }
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    background: #0f172a;
    border: 1px solid var(--card-border);
    color: var(--text);
    text-align: left;
    padding: 12px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.98rem;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .option:hover:not(:disabled) {
    border-color: var(--accent);
    transform: translateY(-1px);
  }
  .option:disabled {
    cursor: default;
  }
  .option.correct {
    background: rgba(34, 197, 94, 0.15);
    border-color: var(--correct);
  }
  .option.incorrect {
    background: rgba(239, 68, 68, 0.15);
    border-color: var(--incorrect);
  }
  .hint-btn {
    background: none;
    border: none;
    color: var(--accent);
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0;
    margin-top: 14px;
    text-decoration: underline;
  }
  .hint-text {
    color: var(--text-dim);
    font-size: 0.88rem;
    margin-top: 8px;
    font-style: italic;
    display: none;
  }
  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 0.92rem;
    line-height: 1.5;
    display: none;
  }
  .feedback.show {
    display: block;
  }
  .feedback.correct-fb {
    background: rgba(34, 197, 94, 0.12);
    border: 1px solid var(--correct);
  }
  .feedback.incorrect-fb {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid var(--incorrect);
  }
  .feedback strong {
    display: block;
    margin-bottom: 4px;
  }
  .feedback a.doc-link {
    display: inline-block;
    margin-top: 10px;
    color: var(--accent);
    font-size: 0.88rem;
    text-decoration: none;
    border-bottom: 1px solid var(--accent);
  }
  .feedback a.doc-link:hover {
    color: var(--accent-dark);
    border-color: var(--accent-dark);
  }
  .nav-row {
    display: flex;
    justify-content: flex-end;
    margin-top: 20px;
  }
  .next-btn {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 10px 22px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 0.95rem;
    display: none;
  }
  .next-btn:hover {
    background: var(--accent-dark);
  }
  .next-btn.show {
    display: inline-block;
  }
  .results {
    text-align: center;
  }
  .results h2 {
    font-size: 1.6rem;
    margin-bottom: 4px;
  }
  .results .score {
    font-size: 2.5rem;
    font-weight: 700;
    color: var(--accent);
    margin: 16px 0;
  }
  .results p {
    color: var(--text-dim);
  }
  .restart-btn {
    background: var(--accent);
    color: #0f172a;
    border: none;
    padding: 12px 28px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    font-size: 1rem;
    margin-top: 16px;
  }
  .restart-btn:hover {
    background: var(--accent-dark);
  }
  .review-list {
    text-align: left;
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .review-item {
    background: #0f172a;
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.9rem;
  }
  .review-item .tag {
    font-weight: 700;
    margin-right: 6px;
  }
  .review-item.correct-tag .tag { color: var(--correct); }
  .review-item.incorrect-tag .tag { color: var(--incorrect); }
  footer {
    text-align: center;
    color: var(--text-dim);
    font-size: 0.8rem;
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Palo Alto Firewall Configuration &amp; Management</h1>
    <p>Test your knowledge of PAN-OS administration</p>
  </header>

  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

  <div class="card" id="quizCard"></div>

  <footer>Built for self-study &middot; no data leaves your browser</footer>
</div>

<script>
const questions = [
  {
    id: "q1",
    prompt: "In PAN-OS, what is the primary purpose of a 'Security Zone'?",
    options: [
      { id: "a", text: "To define a logical grouping of interfaces for applying security policy" },
      { id: "b", text: "To encrypt traffic between two firewalls" },
      { id: "c", text: "To assign IP addresses to devices via DHCP" },
      { id: "d", text: "To store firewall configuration backups" }
    ],
    correct: "a",
    explanation: "Security zones group interfaces (physical, VLAN, tunnel, etc.) so that traffic can be controlled based on the zone it enters (source) and exits (destination) via security policy rules.",
    hint: "Think about how traffic is grouped before policy is applied.",
    correctFeedback: "Exactly right!",
    incorrectFeedback: "Not quite.",
    docUrl: "https://docs.paloaltonetworks.com/ngfw/administration/zone-protection-and-dos-protection/how-do-zones-protect-the-network",
    docLabel: "How Do Zones Protect the Network? — PAN-OS docs"
  },
  {
    id: "q2",
    prompt: "Which PAN-OS feature identifies applications regardless of port, protocol, or evasive tactics?",
    options: [
      { id: "a", text: "App-ID" },
      { id: "b", text: "User-ID" },
      { id: "c", text: "Content-ID" },
      { id: "d", text: "WildFire" }
    ],
    correct: "a",
    explanation: "App-ID uses multiple identification techniques (signatures, decryption, decoding, heuristics) to determine the exact application traversing the network, independent of port or protocol.",
    hint: "The name literally contains the word for what it identifies.",
    correctFeedback: "Correct!",
    incorrectFeedback: "Close, but that's a different ID technology.",
    docUrl: "https://docs.paloaltonetworks.com/ngfw/administration/app-id/app-id-overview",
    docLabel: "App-ID Overview — PAN-OS docs"
  },
  {
    id: "q3",
    prompt: "What is the correct order of evaluation for a Security Policy rulebase in PAN-OS?",
    options: [
      { id: "a", text: "Top-down, first match applies" },
      { id: "b", text: "Bottom-up, first match applies" },
      { id: "c", text: "Most specific rule always wins regardless of order" },
      { id: "d", text: "Rules are evaluated alphabetically by name" }
    ],
    correct: "a",
    explanation: "Security policies are evaluated top-down and the first rule that matches the traffic is applied; rule order matters significantly, which is why more specific rules should be placed above general ones.",
    hint: "Rule ordering is a common source of firewall misconfiguration.",
    correctFeedback: "That's it!",
    incorrectFeedback: "Not quite — think about how order affects matching.",
    docUrl: "https://docs.paloaltonetworks.com/ngfw/getting-started/initial-setup-configuration-ngfws/set-up-a-basic-security-policy-for-the-ngfw",
    docLabel: "Set Up a Basic Security Policy for the NGFW — PAN-OS docs"
  },
  {
    id: "q4",
    prompt: "You need to map network traffic to specific usernames for policy enforcement based on identity rather than IP address. Which feature should you configure?",
    options: [
      { id: "a", text: "User-ID" },
      { id: "b", text: "GlobalProtect" },
      { id: "c", text: "HIP Profiles" },
      { id: "d", text: "Zone Protection Profiles" }
    ],
    correct: "a",
    explanation: "User-ID maps IP addresses to usernames (via integrations like AD, LDAP, Terminal Server agents, or Captive Portal), allowing security policies to be written based on user or group identity.",
    hint: "The feature name matches the identifier it maps to policy.",
    correctFeedback: "Nailed it!",
    incorrectFeedback: "Not this one — that's a related but different feature.",
    docUrl: "https://docs.paloaltonetworks.com/ngfw/administration/user-id/user-id-overview",
    docLabel: "User-ID Overview — PAN-OS docs"
  },
  {
    id: "q5",
    prompt: "Which PAN-OS component is responsible for cloud-based analysis of unknown files to detect zero-day malware?",
    options: [
      { id: "a", text: "WildFire" },
      { id: "b", text: "Threat Prevention" },
      { id: "c", text: "URL Filtering" },
      { id: "d", text: "DoS Protection Profile" }
    ],
    correct: "a",
    explanation: "WildFire is Palo Alto's cloud-based (or on-prem appliance) malware analysis service that detonates unknown files in a sandbox environment to detect zero-day and targeted threats, then distributes signatures back to firewalls.",
    hint: "Think 'sandbox in the cloud'.",
    correctFeedback: "Spot on!",
    incorrectFeedback: "Not quite — that one handles a different threat vector.",
    docUrl: "https://docs.paloaltonetworks.com/ngfw/getting-started/configure-your-ngfws/enable-free-wildfire-forwarding-on-the-ngfw",
    docLabel: "Enable Free WildFire Forwarding on the NGFW — PAN-OS docs"
  },
  {
    id: "q6",
    prompt: "What is the purpose of a 'Virtual Router' in PAN-OS?",
    options: [
      { id: "a", text: "To perform Layer 3 routing decisions for traffic traversing the firewall" },
      { id: "b", text: "To virtualize the management interface" },
      { id: "c", text: "To create isolated administrator login sessions" },
      { id: "d", text: "To load-balance HA pairs" }
    ],
    correct: "a",
    explanation: "A Virtual Router is PAN-OS's Layer 3 routing instance, maintaining its own routing table and supporting static routes and dynamic routing protocols (OSPF, BGP, RIP) independent of other virtual routers on the same device.",
    hint: "Think OSI Layer 3.",
    correctFeedback: "Correct!",
    incorrectFeedback: "Not quite — this is about routing, not sessions or interfaces.",
    docUrl: "https://docs.paloaltonetworks.com/ngfw/networking/configure-virtual-routers",
    docLabel: "Configure Virtual Routers — PAN-OS docs"
  },
  {
    id: "q7",
    prompt: "In a Palo Alto High Availability (HA) Active/Passive deployment, what is exchanged between the two firewalls to keep them synchronized?",
    options: [
      { id: "a", text: "Configuration and session state via HA1 and HA2 links" },
      { id: "b", text: "Only the management IP address" },
      { id: "c", text: "WildFire verdicts only" },
      { id: "d", text: "Nothing; each firewall operates independently" }
    ],
    correct: "a",
    explanation: "HA1 is the control link used for heartbeats and configuration sync, while HA2 is the data link used to sync session and forwarding state, allowing the passive firewall to take over seamlessly on failover.",
    hint: "There are two distinct HA link types with different jobs.",
    correctFeedback: "You got it!",
    incorrectFeedback: "Not quite — HA relies on dedicated sync links.",
    docUrl: "https://docs.paloaltonetworks.com/ngfw/administration/high-availability/ha-links-and-backup-links",
    docLabel: "HA Links and Backup Links — PAN-OS docs"
  }
];

let current = 0;
let score = 0;
let answered = false;
const responses = [];

const quizCard = document.getElementById('quizCard');
const progressFill = document.getElementById('progressFill');

function renderQuestion() {
  answered = false;
  const q = questions[current];
  progressFill.style.width = ((current) / questions.length * 100) + '%';

  quizCard.innerHTML = `
    <div class="question-meta">
      <span>Question ${current + 1} of ${questions.length}</span>
      <span>Score: ${score}</span>
    </div>
    <p class="prompt">${q.prompt}</p>
    <div class="options" id="optionsWrap">
      ${q.options.map(o => `<button class="option" data-id="${o.id}">${o.text}</button>`).join('')}
    </div>
    <button class="hint-btn" id="hintBtn">Show hint</button>
    <p class="hint-text" id="hintText">${q.hint || ''}</p>
    <div class="feedback" id="feedback"></div>
    <div class="nav-row">
      <button class="next-btn" id="nextBtn">${current === questions.length - 1 ? 'See results' : 'Next question'}</button>
    </div>
  `;

  document.getElementById('hintBtn').addEventListener('click', () => {
    const hintText = document.getElementById('hintText');
    hintText.style.display = hintText.style.display === 'block' ? 'none' : 'block';
  });

  document.querySelectorAll('.option').forEach(btn => {
    btn.addEventListener('click', () => selectAnswer(btn.dataset.id));
  });

  document.getElementById('nextBtn').addEventListener('click', () => {
    current++;
    if (current < questions.length) {
      renderQuestion();
    } else {
      renderResults();
    }
  });
}

function selectAnswer(choiceId) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  const isCorrect = choiceId === q.correct;
  if (isCorrect) score++;

  responses.push({ id: q.id, prompt: q.prompt, isCorrect });

  document.querySelectorAll('.option').forEach(btn => {
    btn.disabled = true;
    if (btn.dataset.id === q.correct) {
      btn.classList.add('correct');
    } else if (btn.dataset.id === choiceId) {
      btn.classList.add('incorrect');
    }
  });

  const feedback = document.getElementById('feedback');
  feedback.classList.add('show', isCorrect ? 'correct-fb' : 'incorrect-fb');
  const docLinkHtml = q.docUrl
    ? `<a class="doc-link" href="${q.docUrl}" target="_blank" rel="noopener noreferrer">📄 ${q.docLabel || 'Read the PAN-OS documentation'}</a>`
    : '';
  feedback.innerHTML = `<strong>${isCorrect ? (q.correctFeedback || "That's right.") : (q.incorrectFeedback || "Not quite.")}</strong>${q.explanation}${docLinkHtml}`;

  document.getElementById('nextBtn').classList.add('show');
  progressFill.style.width = ((current + 1) / questions.length * 100) + '%';
}

function renderResults() {
  progressFill.style.width = '100%';
  const pct = Math.round((score / questions.length) * 100);
  quizCard.innerHTML = `
    <div class="results">
      <h2>Quiz complete</h2>
      <div class="score">${score} / ${questions.length}</div>
      <p>${pct}% correct</p>
      <button class="restart-btn" id="restartBtn">Try again</button>
      <div class="review-list">
        ${responses.map(r => `
          <div class="review-item ${r.isCorrect ? 'correct-tag' : 'incorrect-tag'}">
            <span class="tag">${r.isCorrect ? '✓' : '✗'}</span>${r.prompt}
          </div>
        `).join('')}
      </div>
    </div>
  `;
  document.getElementById('restartBtn').addEventListener('click', () => {
    current = 0;
    score = 0;
    responses.length = 0;
    renderQuestion();
  });
}

renderQuestion();
</script>
</body>
</html>
